name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis: ["3.44", "latest"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        # Failures also go to an annotation, which shows on the run page.
        run: |
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee test.log \
            && exit 0
          report=$(sed -n '/^=\{20,\}$/,$p' test.log | head -c 4000)
          report=${report//'%'/'%25'}
          echo "::error title=Unit tests::${report//$'\n'/'%0A'}"
          exit 1
